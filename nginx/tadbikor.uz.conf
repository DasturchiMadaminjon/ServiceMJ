server {
    listen 80;
    server_name tadbikor.uz www.tadbikor.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tadbikor.uz www.tadbikor.uz;

    ssl_certificate /etc/letsencrypt/live/tadbikor.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tadbikor.uz/privkey.pem;

    client_max_body_size 100M;

    # Frontend fayllar joylashgan papka
    root /var/www/frontend;
    index index.html;

    # API, admin va swagger so'rovlarini Docker'dagi backend'ga (8001) jo'natish
    location ~ ^/(api|admin|swagger|redoc|swagger\.json|swagger\.yaml)(/|$) {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media fayllarni Docker backend orqali olish
    location /media/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
    }

    # Qo'shimcha dasturlar alohida ishlashi uchun
    location ~ ^/(geo-metric-92a207|neuromind_ultimate_v3)\.html$ {
        root /var/www/frontend;
        try_files $uri =404;
    }

    # Qolgan hamma so'rovlarni index.html ga (Auth oynasi) yo'naltirish
    location / {
        try_files $uri $uri/ /index.html;
    }
}
