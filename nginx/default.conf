server {
    listen 80;
    server_name tadbikor.uz www.tadbikor.uz;

    # Frontend statik fayllar
    root /var/www/frontend;
    index index.html;

    # ─── API so'rovlari Django'ga yo'naltiriladi ─────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # ─── Admin va Swagger ────────────────────────────────────────
    location ~ ^/(admin|swagger|redoc|swagger\.json|swagger\.yaml)(/|$) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ─── Media fayllar ───────────────────────────────────────────
    location /media/ {
        alias /var/www/media/;
        expires 30d;
    }

    # ─── Qo'shimcha HTML dasturlar (yangi tabda ochiladi) ────────
    # Bu fayllar to'g'ridan-to'g'ri xizmat qilinadi
    location ~ ^/(geo-metric-92a207|neuromind_ultimate_v3)\.html$ {
        root /var/www/frontend;
        try_files $uri =404;
        add_header X-Frame-Options "SAMEORIGIN";
    }

    # ─── Asosiy SPA route ────────────────────────────────────────
    # MUHIM: Barcha boshqa so'rovlar uchun index.html qaytariladi
    # Bu auth oynasini ko'rsatadi — foydalanuvchi login qilmagan bo'lsa
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Statik fayllar keshi ────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ─── Nginx loglar ────────────────────────────────────────────
    access_log /var/log/nginx/servicemj_access.log;
    error_log  /var/log/nginx/servicemj_error.log;
}
